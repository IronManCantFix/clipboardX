[package]
name = "clipboardx"
version = "0.3.4"
description = "A Tauri App"
authors = ["ClipboardX Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipboardx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
# catch-all：ObjC 异常在默认配置下会直接穿过 Rust 帧并 abort 整个进程（SIGABRT，
# 历史崩溃报告 clipboardx-2026-08-27 即此，发生在监听线程读剪贴板/NSWorkspace 时）。
# 启用后每个 msg_send 都被 @catch 包裹，异常转换为带描述与堆栈的 Rust panic，
# 可被监听循环已有的 catch_unwind 捕获恢复（详见 listener.rs / clipboard.rs 注释）。
objc2 = { version = "0.6", features = ["catch-all"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSEvent", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSObject", "NSString", "NSURL"] }
# 液态玻璃：给主弹窗挂系统 NSVisualEffectView 材质（真实背景模糊，自适应深浅色）。
# tauri 已传递依赖本 crate，此处声明为直接依赖供 lib.rs 调用。
window-vibrancy = "0.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 注意：不要用 panic="abort"。本应用在监听线程里用 catch_unwind 兜底，
# abort 模式下任何线程 panic 都会直接干掉整个进程且不留日志（很可能就是
# 「应用自动退出」的元凶）。unwind + debug=1：
#  - 后台线程 panic 可被 catch_unwind 捕获，应用继续运行；
#  - 未被捕获的 panic 先被全局钩子写入日志（含回溯）再退出。
# debug=1 提供行号信息（配合 logging.rs 的 panic 回溯定位崩溃点）；去掉
# strip，否则 release 二进制的回溯全是 <unknown> 无法定位。
panic = "unwind"
codegen-units = 1
lto = "fat"
opt-level = "z"
debug = 1
