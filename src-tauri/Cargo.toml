[package]
name = "clipboardx"
version = "0.1.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipboardx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
enigo = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSEvent", "NSWorkspace"] }
objc2-foundation = { version = "0.3" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 减小安装包体积与内存占用（Tauri 官方推荐配置）
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = true
