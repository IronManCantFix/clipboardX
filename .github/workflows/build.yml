name: Build macOS (Apple Silicon)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build macOS app (Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target aarch64-apple-darwin

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          fi
          BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle"
          DMG="$(ls "$BUNDLE"/dmg/*.dmg | head -1)"
          ZIP="${DMG%.dmg}.app.zip"
          ditto -c -k --keepParent "$BUNDLE/macos/ClipboardX.app" "$ZIP"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$ZIP" --clobber
            gh release edit "$TAG" --draft
          else
            gh release create "$TAG" --draft --title "ClipboardX $TAG" --generate-notes "$DMG" "$ZIP"
          fi
